name: Deploy Frontend to Vercel

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_Vzw9dPqgnCeaflj1qX56NfaJ
  VERCEL_PROJECT_ID: prj_xwrcgBXHAXxjp62cP5wWmdGJ7E4e

# The Vercel project's Root Directory is "frontend", so the Vercel CLI runs from
# the repository root and applies that setting itself. Running it from inside
# frontend/ makes Vercel look for frontend/frontend and the build fails.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
